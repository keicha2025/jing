# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: preview/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: preview
      - name: Build
        run: |
          npm run build
          # Create a subdirectory called 'preview' inside dist and move contents into it
          # to match the desired URL structure https://.../jing/preview/
          mkdir -p dist_final/preview
          cp -r dist/* dist_final/preview/
        working-directory: preview
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload from dist_final so that the preview folder exists at the root
          path: './preview/dist_final'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
