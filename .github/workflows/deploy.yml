# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Projects
        run: |
          mkdir -p dist_final
          
          # Build 'preview'
          cd preview
          npm install
          npm run build
          mkdir -p ../dist_final/preview
          cp -r dist/* ../dist_final/preview/
          cd ..
          
          # Build 'v-player-preview'
          cd v-player-preview
          npm install
          npm run build
          mkdir -p ../dist_final/v-player-preview
          cp -r dist/* ../dist_final/v-player-preview/
          cd ..

          # Build 'pdf-tool'
          cd pdf-tool
          npm install
          npm run build
          mkdir -p ../dist_final/pdf-tool
          cp -r dist/* ../dist_final/pdf-tool/
          # Create redirect carefully to overwrite the built index
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://jing-lab.web.app/pdf-tool/"></head><body><p>Redirecting to <a href="https://jing-lab.web.app/pdf-tool/">https://jing-lab.web.app/pdf-tool/</a>...</p></body></html>' > ../dist_final/pdf-tool/index.html
          cd ..
          
          # Build 'travel-planner'
          cd travel-planner/frontend
          npm install
          npm run build
          mkdir -p ../../dist_final/travel-planner
          cp -r dist/* ../../dist_final/travel-planner/
          cd ../..
          
          # Copy static projects and root html files
          cp -r note dist_final/ || true
          cp -r nightwhisper dist_final/ || true
          cp *.html dist_final/ || true
          
          # Ensure an index.html exists at the very root
          if [ ! -f dist_final/index.html ]; then
             echo "<html><body><h1>Jing's Projects</h1><ul><li><a href='v-player-preview/'>V-Player</a></li><li><a href='preview/'>Audio Player</a></li><li><a href='note/'>Note</a></li></ul></body></html>" > dist_final/index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist_final'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
