<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Icon Preview - Email Studio</title>
    <style>
        body {
            background-color: #1c1917;
            /* Stone 900 */
            color: #e7e5e4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            display: flex;
            gap: 40px;
            margin-top: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #6366f1;
        }

        img {
            width: 128px;
            height: 128px;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 1.1rem;
            margin: 8px 0;
        }

        p {
            font-size: 0.85rem;
            color: #a8a29e;
        }
    </style>
</head>

<body>
    <h1>Email Studio SVG 圖標預覽</h1>
    <div class="container">
        <div class="card">
            <img src="icon_v1.svg" alt="Option 1">
            <h2>方案一</h2>
            <p>極簡紙飛機</p>
        </div>
        <div class="card">
            <img src="icon_v2.svg" alt="Option 2">
            <h2>方案二</h2>
            <p>現代摺疊信封</p>
        </div>
        <div class="card">
            <img src="icon_v3.svg" alt="Option 3">
            <h2>方案三</h2>
            <p>數位印記 'M'</p>
        </div>
    </div>
</body>

</html>
