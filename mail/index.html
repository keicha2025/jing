<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>Minimalist Email Studio</title>
    <link rel="icon" type="image/svg+xml" href="/mail/favicon.svg" />
    <link rel="manifest" href="/mail/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111827">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React Stack -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/mail/config.js"></script>

    <!-- Firebase SDK (Compatibility version for easy script tag use) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ui: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            800: '#1f2937',
                            900: '#111827',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html {
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* IE/Edge */
        }

        html::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, Edge */
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        .form-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: all 0.2s;
            outline: none;
            background-color: #fff;
        }

        .form-input:focus {
            border-color: #4b5563;
            box-shadow: 0 0 0 1px rgba(75, 85, 99, 0.1);
        }

        .label-text {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .theme-btn.active {
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px #1f2937;
        }
    </style>
</head>

<body class="bg-gray-50 h-screen overflow-hidden text-gray-800">

    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const Icon = ({ name, size = 16, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.lucide) {
                    // 清空之前的內容，避免重複渲染
                    containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: containerRef.current,
                        attrs: {
                            class: `lucide lucide-${name} ${className}`,
                            width: size,
                            height: size,
                            'stroke-width': 2
                        }
                    });
                }
            }, [name, size, className]);
            return <span ref={containerRef} className="inline-flex items-center justify-center"></span>;
        };

        // --- 全新調色盤 ---
        const THEMES = [
            {
                id: 'matcha',
                name: '京都抹茶 (Matcha)',
                colors: {
                    bg: '#f6f8f6',
                    card: '#ffffff',
                    heading: '#2d3e30',
                    text: '#566359',
                    accent: '#557c55',
                    border: '#e8ebe9',
                    btnText: '#ffffff'
                }
            },
            {
                id: 'obsidian',
                name: '極致黑白 (Obsidian)',
                colors: {
                    bg: '#fafafa',
                    card: '#ffffff',
                    heading: '#000000',
                    text: '#171717',
                    accent: '#000000',
                    border: '#e5e5e5',
                    btnText: '#ffffff'
                }
            },
            {
                id: 'mist',
                name: '迷霧藍灰 (Mist)',
                colors: {
                    bg: '#f1f5f9',
                    card: '#ffffff',
                    heading: '#334155',
                    text: '#64748b',
                    accent: '#475569',
                    border: '#e2e8f0',
                    btnText: '#ffffff'
                }
            },
            {
                id: 'latte',
                name: '燕麥拿鐵 (Latte)',
                colors: {
                    bg: '#fdfbf7',
                    card: '#fffefc',
                    heading: '#5c5c50',
                    text: '#78786a',
                    accent: '#a3907c',
                    border: '#ebe8e0',
                    btnText: '#ffffff'
                }
            },
            {
                id: 'haze',
                name: '煙燻紫 (Haze)',
                colors: {
                    bg: '#f7f7fa',
                    card: '#ffffff',
                    heading: '#413c58',
                    text: '#6b667a',
                    accent: '#7b7294',
                    border: '#e9e8ed',
                    btnText: '#ffffff'
                }
            }
        ];


        // --- Auth Configuration ---
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
        }

        // 雜湊函數：用於在前端比對 Email 而不洩露白名單清單
        const hashEmail = async (email) => {
            if (!email) return '';
            const encoder = new TextEncoder();
            const data = encoder.encode(email.trim().toLowerCase());
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const Login = ({ onAuth }) => {
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async () => {
                setLoading(true);
                setError('');
                const provider = new firebase.auth.GoogleAuthProvider();

                // 額外要求 Gmail 讀取設定與寄信權限
                provider.addScope('https://www.googleapis.com/auth/gmail.settings.basic');
                provider.addScope('https://www.googleapis.com/auth/gmail.send');

                try {
                    const result = await firebase.auth().signInWithPopup(provider);
                    const email = result.user.email;
                    const accessToken = result.credential.accessToken;

                    // 比對雜湊值
                    const allowedHashes = [
                        '333c7d8817bca200573db9a8dda9fdcf6cb97e77702446bad6daf1596b366acc',
                        'a3538167d256b6b3187e95d1c0f4df3c1e249dadad3f9a76537fd993320bca7b'
                    ];

                    const userHash = await hashEmail(email);

                    if (allowedHashes.includes(userHash)) {
                        // 將 Token 傳給上層
                        onAuth({ ...result.user, accessToken });
                    } else {
                        setError('驗證失敗：您無權存取此工具');
                        await firebase.auth().signOut();
                    }
                } catch (err) {
                    setError('登入失敗：' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-[#f9fafb] flex flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-50 to-gray-100">
                    <div className="max-w-md w-full bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] p-10 text-center space-y-8 border border-gray-100 relative overflow-hidden">
                        {/* 裝飾背景 */}
                        <div className="absolute -top-24 -right-24 w-48 h-48 bg-gray-50 rounded-full blur-3xl opacity-50"></div>
                        <div className="absolute -bottom-24 -left-24 w-48 h-48 bg-gray-50 rounded-full blur-3xl opacity-50"></div>

                        <div className="relative">
                            <div className="inline-flex p-5 bg-gray-900 text-white rounded-[2rem] shadow-2xl mb-2 transform hover:rotate-6 transition-transform">
                                <Icon name="mail" size={48} />
                            </div>
                            <h1 className="text-3xl font-extrabold text-gray-900 tracking-tight">Email Studio</h1>
                            <p className="text-gray-500 mt-3 text-sm leading-relaxed max-w-[240px] mx-auto font-medium">
                                專為現代簡約設計而生的電子郵件卡片生成器
                            </p>
                        </div>

                        <div className="space-y-4 pt-4">
                            {error && (
                                <div className="bg-red-50 text-red-600 p-4 rounded-2xl text-xs font-bold border border-red-100 animate-shake">
                                    {error}
                                </div>
                            )}

                            <button
                                onClick={handleLogin}
                                disabled={loading}
                                className="w-full py-4 px-6 bg-white border border-gray-200 rounded-2xl font-bold text-gray-700 flex items-center justify-center gap-4 hover:bg-gray-50 hover:border-gray-300 transition-all shadow-sm active:scale-95 disabled:opacity-50 group"
                            >
                                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-6 h-6 group-hover:scale-110 transition-transform" alt="Google" />
                                {loading ? '正在驗證權限...' : '使用 Google 帳號探索'}
                            </button>

                            <p className="text-[10px] text-gray-400 font-medium pt-2">
                                受限存取工具 · 需經由內部計畫白名單授權
                            </p>
                        </div>
                    </div>

                    <div className="mt-8 text-gray-400 text-[10px] font-mono tracking-widest uppercase">
                        Jing Lab © 2026 Premium Suite
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = firebase.auth().onAuthStateChanged(async (user) => {
                    if (user) {
                        const allowedHashes = [
                            '333c7d8817bca200573db9a8dda9fdcf6cb97e77702446bad6daf1596b366acc',
                            'a3538167d256b6b3187e95d1c0f4df3c1e249dadad3f9a76537fd993320bca7b'
                        ];
                        const userHash = await hashEmail(user.email);
                        if (allowedHashes.includes(userHash)) {
                            // 注意：重新整理頁面時 accessToken 會遺失
                            // 如果是從 redirect 回來或是 session 恢復，我們可能沒有 token
                            setUser(user);
                        } else {
                            await firebase.auth().signOut();
                            setUser(null);
                        }
                    } else {
                        setUser(null);
                    }
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (authLoading) return (
                <div className="h-screen flex items-center justify-center bg-[#f9fafb]">
                    <div className="flex flex-col items-center gap-4">
                        <div className="w-12 h-12 border-4 border-gray-200 border-t-gray-900 rounded-full animate-spin"></div>
                        <div className="text-[10px] text-gray-400 font-mono tracking-widest uppercase animate-pulse">Initializing Security</div>
                    </div>
                </div>
            );

            if (!user) return <Login onAuth={setUser} />;

            return <Editor user={user} onLogout={() => {
                firebase.auth().signOut();
                setUser(null);
            }} />;
        };

        const Editor = ({ user, onLogout }) => {
            // 狀態管理
            const [aliases, setAliases] = useState([]);
            const [loading, setLoading] = useState(false);
            const [status, setStatus] = useState({ type: '', msg: '' });
            const [previewDevice, setPreviewDevice] = useState('desktop');
            const [showThemeList, setShowThemeList] = useState(false);
            const [viewMode, setViewMode] = useState('edit'); // 'edit' or 'preview' (mobile only)

            const [data, setData] = useState({
                from: '',
                senderName: '',
                to: '',
                cc: '',
                bcc: 'wj209ing@gmail.com', // 預設 BCC
                subject: '', // 預設留空
                preheader: '',
                title: '在此輸入標題',
                body: '這是一份現代簡約的電子郵件卡片。\n\n您可以使用 **粗體文字** 來強調重點，或是使用 [[主題顏色]] 來標示關鍵字。\n\n我們專注於提供清晰、無干擾的閱讀體驗。',
                footer: '',// 預設留空
                themeId: 'matcha',
                showButtons: true,
                buttons: [{ id: 1, text: '閱讀更多', url: '#', variant: 'primary' }]
            });

            const activeTheme = useMemo(() => THEMES.find(t => t.id === data.themeId) || THEMES[0], [data.themeId]);

            // 核心：使用官方 Gmail API 取得別名
            const fetchGmailAliases = async () => {
                if (!user.accessToken) {
                    console.warn("缺少 AccessToken，功能受限");
                    return [user.email];
                }
                try {
                    const response = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/settings/sendAs', {
                        headers: { 'Authorization': `Bearer ${user.accessToken}` }
                    });

                    if (response.status === 403) {
                        setStatus({
                            type: 'error',
                            msg: '403 錯誤：請確認 GCP 專案已啟動 Gmail API (或您未勾選權限)'
                        });
                        throw new Error('GCP 專案未啟動 Gmail API');
                    }

                    if (!response.ok) throw new Error(`API 錯誤: ${response.status}`);

                    const res = await response.json();
                    const list = res.sendAs ? res.sendAs.map(a => a.sendAsEmail) : [user.email];
                    setAliases(list);
                    if (list.length > 0) setData(prev => ({ ...prev, from: list[0] }));
                    return list;
                } catch (e) {
                    console.error("Gmail API 失敗", e);
                    // 如果是權限或是 API 未開啟，不再重複設錯，讓 status 顯示
                    if (aliases.length === 0) setAliases([user.email]);
                    return [user.email];
                }
            };

            // 核心：使用官方 Gmail API 寄信 + 非同步呼叫 GAS 紀錄
            const handleGmailSend = async (payload) => {
                if (!user.accessToken) throw new Error('請重新登入');

                // MIME Header 編碼 (RFC 2047 規範) 避免中文亂碼
                const encodeB64 = (str) => btoa(unescape(encodeURIComponent(str)));
                const encodeHeader = (str) => {
                    if (!str || !/[^\x00-\x7f]/.test(str)) return str;
                    return `=?utf-8?B?${encodeB64(str)}?=`;
                };

                const fromHeader = payload.senderName
                    ? `${encodeHeader(payload.senderName)} <${payload.from}>`
                    : payload.from;
                const subjectHeader = encodeHeader(payload.subject || '');

                // 1. 構建符合 Gmail API 的 Raw Email (Base64Url)
                const emailLines = [
                    `From: ${fromHeader}`,
                    `To: ${payload.recipient}`,
                    `Subject: ${subjectHeader}`,
                    `MIME-Version: 1.0`,
                    `Content-Type: text/html; charset=utf-8`,
                    ``,
                    payload.htmlBody
                ];
                if (payload.cc) emailLines.splice(3, 0, `Cc: ${payload.cc}`);
                if (payload.bcc) emailLines.splice(3, 0, `Bcc: ${payload.bcc}`);

                const emailStr = emailLines.join('\r\n');

                // 確保整個 MIME message 使用 UTF-8 Bytes
                const encoder = new TextEncoder();
                const bytes = encoder.encode(emailStr);
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }

                const b64hash = btoa(binary)
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

                // 2. 直接呼叫官方 API 寄件 (保證成功且無 CORS)
                const gmailRes = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${user.accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ raw: b64hash })
                });

                if (!gmailRes.ok) throw new Error('Gmail API 寄信失敗');

                // 3. 非同步呼叫 GAS 紀錄 (使用 no-cors 模式避開錯誤，因為我們不依賴它的回傳值)
                if (typeof GAS_API_URL !== 'undefined' && GAS_API_URL) {
                    fetch(GAS_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action: 'sendEmail', ...payload })
                    }).catch(e => console.warn('GAS 紀錄失敗(可忽略)', e));
                }

                return { success: true, message: '信件已成功發送！' };
            };

            // 初始化別名
            useEffect(() => {
                fetchGmailAliases();
            }, []);

            const handleSend = async () => {
                setLoading(true);
                setStatus({ type: 'info', msg: '正在寄送...' });

                const htmlBody = generateHtml();
                const payload = {
                    recipient: data.to,
                    subject: data.subject,
                    htmlBody: htmlBody,
                    from: data.from,
                    senderName: data.senderName,
                    cc: data.cc,
                    bcc: data.bcc,
                    body: data.body
                };

                try {
                    const res = await handleGmailSend(payload);
                    if (res.success) {
                        setStatus({ type: 'success', msg: res.message });
                        setTimeout(() => setStatus({ type: '', msg: '' }), 5000);
                    } else {
                        setStatus({ type: 'error', msg: res.message });
                    }
                } catch (e) {
                    setStatus({ type: 'error', msg: '發送失敗: ' + e.message });
                } finally {
                    setLoading(false);
                }
            };

            const update = (field, value) => setData(prev => ({ ...prev, [field]: value }));

            const updateBtn = (id, field, value) => {
                setData(prev => ({
                    ...prev,
                    buttons: prev.buttons.map(b => b.id === id ? { ...b, [field]: value } : b)
                }));
            };

            const addBtn = () => {
                if (data.buttons.length < 4) {
                    setData(prev => ({
                        ...prev,
                        buttons: [...prev.buttons, { id: Date.now(), text: '按鈕', url: '#', variant: 'secondary' }]
                    }));
                }
            };

            const removeBtn = (id) => {
                setData(prev => ({
                    ...prev,
                    buttons: prev.buttons.filter(b => b.id !== id)
                }));
            };

            // HTML 生成器 (含特殊語法解析)
            const generateHtml = () => {
                const { preheader, title, body, footer, buttons, showButtons } = data;
                const t = activeTheme.colors;

                // 解析內文
                const parsedBody = body
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/\[\[(.*?)\]\]/g, `<span style="color: ${t.accent}; font-weight: 700;">$1</span>`) // [[Color]]
                    .replace(/\*\*(.*?)\*\*/g, `<strong>$1</strong>`) // **Bold**
                    .replace(/\n/g, '<br/>');

                // 按鈕 HTML
                let btnHtml = '';
                if (showButtons && buttons.length > 0) {
                    const btns = buttons.map(b => {
                        const isPri = b.variant === 'primary';
                        const bg = isPri ? t.accent : 'transparent';
                        const fg = isPri ? t.btnText : t.accent;
                        const bd = isPri ? t.accent : '#d1d5db'; // 次要按鈕邊框淡一點

                        return `
              <div style="margin-bottom: 12px;">
                <a href="${b.url}" target="_blank" style="display: inline-block; background-color: ${bg}; color: ${fg}; border: 1px solid ${bd}; padding: 12px 28px; text-decoration: none; border-radius: 4px; font-weight: 500; font-size: 14px; text-align: center;">
                  ${b.text}
                </a>
              </div>
            `;
                    }).join('');
                    btnHtml = `<div style="padding-top: 10px;">${btns}</div>`;
                }

                // 完整 HTML 結構
                return `
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background-color:${t.bg};font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <div style="display:none;max-height:0;overflow:hidden;">${preheader}</div>
  <div style="background-color:${t.bg};padding:40px 10px;">
    <div style="max-width:600px;margin:0 auto;background-color:${t.card};border:1px solid ${t.border};border-radius:8px;overflow:hidden;box-shadow:0 4px 6px -1px rgba(0,0,0,0.02);">
      <div style="padding:40px 40px 30px 40px;">
        ${preheader ? `<p style="color:${t.accent};font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 20px 0;font-weight:700;">${preheader}</p>` : ''}
        <h1 style="color:${t.heading};font-size:26px;margin:0 0 24px 0;line-height:1.3;font-weight:700;letter-spacing:-0.02em;">${title}</h1>
        <div style="color:${t.text};font-size:16px;line-height:1.75;margin:0 0 30px 0;">${parsedBody}</div>
        ${btnHtml}
      </div>
      ${footer ? `<div style="background-color:${t.card};border-top:1px solid ${t.border};padding:24px 40px;text-align:center;"><p style="color:#9ca3af;font-size:11px;margin:0;line-height:1.5;">${footer}</p></div>` : ''}
    </div>
  </div>
</body></html>`;
            };

            // 已移除舊版 handleSend

            return (
                <div className="flex flex-col lg:flex-row h-screen relative">
                    {/* 手機版模式切換 */}
                    <div className="lg:hidden absolute bottom-24 right-6 z-50 flex flex-col gap-3">
                        <button
                            onClick={() => setViewMode(viewMode === 'edit' ? 'preview' : 'edit')}
                            className="w-14 h-14 bg-gray-900 text-white rounded-full shadow-2xl flex items-center justify-center transform active:scale-95 transition-all"
                        >
                            <Icon name={viewMode === 'edit' ? 'eye' : 'edit-3'} size={24} />
                        </button>
                    </div>

                    {/* 左側：設定面板 */}
                    <div className={`w-full lg:w-[480px] bg-white border-r border-gray-200 flex flex-col h-full z-10 shadow-xl lg:flex ${viewMode === 'edit' ? 'flex' : 'hidden'}`}>
                        {/* Header */}
                        <div className="p-4 border-b border-gray-100 flex items-center justify-between bg-white/80 backdrop-blur-md sticky top-0 z-20">
                            <div className="flex items-center gap-3">
                                <div className="bg-gray-900 text-white p-2 rounded-xl shadow-lg shadow-gray-200">
                                    <Icon name="mail" size={20} />
                                </div>
                                <div>
                                    <h1 className="font-bold text-gray-900 text-base leading-tight">Email Studio</h1>
                                    <div className="flex items-center gap-2">
                                        <span className="text-[10px] text-gray-400 font-medium uppercase tracking-wider font-mono opacity-60">{user.email}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button
                                    onClick={onLogout}
                                    className="flex items-center gap-2 px-3 py-1.5 bg-gray-50 hover:bg-gray-100 text-gray-500 hover:text-gray-900 rounded-xl transition-all border border-gray-100 group"
                                >
                                    <Icon name="log-out" size={14} className="group-hover:-translate-x-0.5 transition-transform" />
                                    <span className="text-xs font-bold">登出</span>
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 space-y-8">

                            {/* 1. 寄件資訊 */}
                            <section className="space-y-4">
                                <div className="flex items-center gap-2 text-gray-900 font-bold text-sm">
                                    <Icon name="send" size={14} className="text-gray-400" /> 寄件設定
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="label-text">寄件別名 (From)</label>
                                        <select value={data.from} onChange={e => update('from', e.target.value)} className="form-input bg-gray-50">
                                            {Array.isArray(aliases) && aliases.map(a => <option key={a} value={a}>{a}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="label-text">顯示名稱 (Name)</label>
                                        <input type="text" value={data.senderName} onChange={e => update('senderName', e.target.value)} className="form-input" placeholder="選填" />
                                    </div>
                                </div>

                                <div>
                                    <label className="label-text">收件人 (To)</label>
                                    <input type="text" value={data.to} onChange={e => update('to', e.target.value)} className="form-input" placeholder="example@gmail.com" />
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="label-text">副本 (CC)</label>
                                        <input type="text" value={data.cc} onChange={e => update('cc', e.target.value)} className="form-input" />
                                    </div>
                                    <div>
                                        <label className="label-text">密件副本 (BCC)</label>
                                        <input type="text" value={data.bcc} onChange={e => update('bcc', e.target.value)} className="form-input text-gray-500" />
                                    </div>
                                </div>

                                <div>
                                    <label className="label-text">信件主旨</label>
                                    <input type="text" value={data.subject} onChange={e => update('subject', e.target.value)} className="form-input font-medium" placeholder="請輸入主旨..." />
                                </div>
                            </section>

                            <hr className="border-gray-100" />

                            {/* 2. 內容編輯 */}
                            <section className="space-y-4">
                                <div className="flex items-center gap-2 text-gray-900 font-bold text-sm">
                                    <Icon name="file-text" size={14} className="text-gray-400" /> 內容編輯
                                </div>

                                <div>
                                    <label className="label-text">小標題 (Preheader)</label>
                                    <input type="text" value={data.preheader} onChange={e => update('preheader', e.target.value)} className="form-input" placeholder="選填，顯示於列表摘要" />
                                </div>

                                <div>
                                    <label className="label-text">卡片標題</label>
                                    <input type="text" value={data.title} onChange={e => update('title', e.target.value)} className="form-input font-bold text-lg" />
                                </div>

                                <div>
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="label-text mb-0">內文內容</label>
                                        <span className="text-[10px] text-gray-400 bg-gray-100 px-2 py-0.5 rounded">[[顏色]] **粗體**</span>
                                    </div>
                                    <textarea rows={8} value={data.body} onChange={e => update('body', e.target.value)} className="form-input leading-relaxed resize-y"></textarea>
                                </div>

                                <div>
                                    <label className="label-text">頁尾 (Footer)</label>
                                    <input type="text" value={data.footer} onChange={e => update('footer', e.target.value)} className="form-input text-gray-500" />
                                </div>
                            </section>

                            <hr className="border-gray-100" />

                            {/* 3. 按鈕區 */}
                            <section className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-2 text-gray-900 font-bold text-sm">
                                        <Icon name="mouse-pointer-click" size={14} className="text-gray-400" /> 按鈕設定
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <label className="flex items-center text-xs cursor-pointer select-none">
                                            <input type="checkbox" checked={data.showButtons} onChange={e => update('showButtons', e.target.checked)} className="mr-1.5" />
                                            啟用
                                        </label>
                                        <button onClick={addBtn} disabled={!data.showButtons || data.buttons.length >= 4} className="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded transition disabled:opacity-50">
                                            <Icon name="plus" size={12} /> 新增
                                        </button>
                                    </div>
                                </div>

                                {data.showButtons && (
                                    <div className="space-y-3">
                                        {data.buttons.map(btn => (
                                            <div key={btn.id} className="p-3 bg-gray-50 border border-gray-200 rounded-lg relative group">
                                                <button onClick={() => removeBtn(btn.id)} className="absolute top-2 right-2 text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition"><Icon name="x" size={14} /></button>

                                                <div className="grid grid-cols-12 gap-2 mb-2">
                                                    <div className="col-span-8">
                                                        <input type="text" value={btn.text} onChange={e => updateBtn(btn.id, 'text', e.target.value)} className="w-full text-xs p-1.5 border border-gray-300 rounded outline-none focus:border-gray-500" placeholder="按鈕文字" />
                                                    </div>
                                                    <div className="col-span-4">
                                                        <select value={btn.variant} onChange={e => updateBtn(btn.id, 'variant', e.target.value)} className="w-full text-xs p-1.5 border border-gray-300 rounded outline-none focus:border-gray-500 bg-white">
                                                            <option value="primary">實心</option>
                                                            <option value="secondary">外框</option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <input type="text" value={btn.url} onChange={e => updateBtn(btn.id, 'url', e.target.value)} className="w-full text-xs p-1.5 border border-gray-300 rounded font-mono text-gray-500 outline-none focus:border-gray-500" placeholder="https://" />
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </section>

                            <hr className="border-gray-100" />

                            {/* 4. 風格選擇 (Accordian) */}
                            <section>
                                <button onClick={() => setShowThemeList(!showThemeList)} className="w-full flex justify-between items-center text-left py-2 hover:bg-gray-50 -mx-2 px-2 rounded transition">
                                    <div className="flex items-center gap-2 text-gray-900 font-bold text-sm">
                                        <Icon name="palette" size={14} className="text-gray-400" /> 風格主題：{activeTheme.name}
                                    </div>
                                    <Icon name={showThemeList ? "chevron-up" : "chevron-down"} size={14} className="text-gray-400" />
                                </button>

                                {showThemeList && (
                                    <div className="grid grid-cols-1 gap-2 mt-3 animate-fadeIn pb-4">
                                        {THEMES.map(t => (
                                            <button
                                                key={t.id}
                                                onClick={() => update('themeId', t.id)}
                                                className={`flex items-center p-3 rounded-lg border text-left transition-all ${data.themeId === t.id ? 'border-gray-900 bg-gray-900 text-white shadow-md' : 'border-gray-200 bg-white hover:border-gray-300'}`}
                                            >
                                                <div className="flex items-center gap-1 mr-3">
                                                    <div className="w-4 h-4 rounded-full border border-white/30" style={{ background: t.colors.heading }}></div>
                                                    <div className="w-4 h-4 rounded-full border border-white/30" style={{ background: t.colors.accent }}></div>
                                                    <div className="w-4 h-4 rounded-full border border-white/30" style={{ background: t.colors.bg }}></div>
                                                </div>
                                                <div className="text-sm font-medium">{t.name}</div>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </section>

                        </div>

                        {/* Footer Action */}
                        <div className="p-5 border-t border-gray-200 bg-white z-20">
                            <button
                                onClick={handleSend}
                                disabled={loading}
                                className={`w-full py-3 rounded-lg text-white font-medium shadow-lg flex items-center justify-center transition-all transform active:scale-[0.98] ${loading ? 'bg-gray-400 cursor-not-allowed' : 'bg-gray-900 hover:bg-gray-800'}`}
                            >
                                {loading ? <Icon name="loader-2" className="animate-spin mr-2" /> : <Icon name="send" className="mr-2" />}
                                {loading ? '處理中...' : '確認寄出'}
                            </button>
                            {status.msg && (
                                <div className={`mt-3 text-center text-xs font-bold ${status.type === 'error' ? 'text-red-500' : status.type === 'success' ? 'text-green-600' : 'text-gray-500'}`}>
                                    {status.msg}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 右側：預覽區 */}
                    <div className={`flex-1 bg-[#f8f9fa] flex-col relative overflow-hidden lg:flex ${viewMode === 'preview' ? 'flex' : 'hidden'}`}>
                        {/* Device Toggle Optimized */}
                        <div className="absolute top-8 left-1/2 transform -translate-x-1/2 z-30 inline-flex p-1 bg-white/70 backdrop-blur-xl border border-gray-200 rounded-[20px] shadow-sm">
                            <button
                                onClick={() => setPreviewDevice('desktop')}
                                className={`px-4 py-2 rounded-[16px] flex items-center gap-2 transition-all ${previewDevice === 'desktop' ? 'bg-gray-900 text-white shadow-lg' : 'text-gray-400 hover:text-gray-900'}`}
                            >
                                <Icon name="monitor" size={16} />
                                <span className="text-[10px] font-bold uppercase tracking-wider">Desktop</span>
                            </button>
                            <button
                                onClick={() => setPreviewDevice('mobile')}
                                className={`px-4 py-2 rounded-[16px] flex items-center gap-2 transition-all ${previewDevice === 'mobile' ? 'bg-gray-900 text-white shadow-lg' : 'text-gray-400 hover:text-gray-900'}`}
                            >
                                <Icon name="smartphone" size={16} />
                                <span className="text-[10px] font-bold uppercase tracking-wider">Mobile</span>
                            </button>
                        </div>

                        {/* Preview Canvas */}
                        <div className="flex-1 w-full flex items-center justify-center overflow-auto p-4 lg:p-12 relative mt-12 lg:mt-0">
                            <div className={`transition-all duration-500 bg-white shadow-2xl overflow-hidden ${previewDevice === 'mobile' ? 'w-[375px] h-[720px] rounded-[32px] border-[8px] border-gray-800' : 'w-[680px] h-[85vh] rounded-lg border border-gray-200'}`}>
                                {/* 使用 dangerouslySetInnerHTML 直接渲染生成的 HTML，確保完全一致 */}
                                <div className="w-full h-full overflow-y-auto" style={{ backgroundColor: activeTheme.colors.bg }} dangerouslySetInnerHTML={{ __html: generateHtml() }} />
                            </div>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
