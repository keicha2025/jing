<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JING Privacy Player</title>
    <link rel="stylesheet" href="video-style.css">
    <link rel="manifest" href="video-manifest.json">
</head>
<body oncontextmenu="return false;"> <div id="app" class="mini-mode">
        <input type="file" id="fileInput" accept="video/*" hidden>
        <div id="uploadUI" class="upload-ui">
            <button onclick="document.getElementById('fileInput').click()">選取影片啟動</button>
        </div>

        <div class="player-container" id="playerContainer">
            <video id="mainVideo" playsinline></video>
            
            <div class="overlay" id="overlay">
                <div id="playBtn" class="center-btn">▶</div>
                <div id="pauseBtn" class="center-btn" style="display:none;">⏸</div>
                
                <div class="feedback" id="feedback"></div>

                <div class="bottom-controls">
                    <div class="progress-bar-container" id="progressContainer">
                        <div class="progress-filled" id="progressFilled"></div>
                    </div>
                </div>
            </div>
            
            <div id="privacyMask" class="privacy-mask">無痕模式保護中</div>
        </div>
    </div>
    <script src="video-script.js"></script>
</body>
</html>
