<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專案儲存庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .project-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-card:active {
            transform: scale(0.97);
        }

        .glass-effect {
            background: rgba(250, 250, 249, 0.85);
            /* Stone 50 with alpha */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e7e5e4;
            /* Stone 200 */
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-[#F8F8F7] text-stone-800 min-h-screen pb-20">

    <!-- 頁首區塊 -->
    <header class="sticky top-0 z-50 glass-effect border-b border-stone-200/60 px-6 py-6 mb-10">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
                <h1 class="text-xl font-semibold tracking-tight text-stone-900">專案索引</h1>
                <p class="text-xs text-stone-400 mt-1 font-medium tracking-widest uppercase">Workspace Repository</p>
            </div>

            <!-- 搜尋框 -->
            <div class="relative group">
                <i data-lucide="search"
                    class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-400 group-focus-within:text-stone-600 transition-colors"></i>
                <input type="text" id="searchInput" placeholder="搜尋名稱..."
                    class="w-full md:w-64 pl-10 pr-4 py-2 bg-stone-100/50 border-stone-200 border focus:bg-white focus:border-stone-400 rounded-xl transition-all outline-none text-sm placeholder:text-stone-400">
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6">
        <!-- 專案網格 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="projectsGrid">
            <!-- 由 JavaScript 生成 -->
        </div>

        <!-- 空狀態 -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-32 text-stone-400">
            <i data-lucide="inbox" class="w-10 h-10 mb-4 stroke-[1.5px] opacity-30"></i>
            <p class="text-sm">無相符專案</p>
        </div>
    </main>

    <script>
        // 專案資料
        const projects = [
            {
                title: "DeepNight 睡眠追蹤",
                description: "智慧睡眠監測 PWA — 偵測打呼與夢話，波形分析一目了然。",
                path: "deepnight/index.html",
                icon: "moon"
            },
            {
                title: "note 筆記應用",
                description: "極簡風格的雲端筆記工具，支援標籤、排序與變更比對。",
                path: "note/index.html",
                icon: "pencil"
            },
            {
                title: "個人音檔播放器",
                description: "基於 Vite + React 的音檔播放器前端專案。",
                path: "preview/index.html",
                icon: "headphones"
            },
            {
                title: "V-Player Web App",
                description: "影音播放器 Web App，深色介面設計。",
                path: "v-player-preview/index.html",
                icon: "play-circle"
            },
            {
                title: "Travel Planner",
                description: "旅遊行程規劃工具，Vue + Vite 前後端架構。",
                path: "travel-planner/frontend/index.html",
                icon: "map-pin"
            },
            {
                title: "關西・名古屋 7日漫遊",
                description: "2025 大阪、奈良、京都、名古屋七日自由行行程表。",
                path: "nagoya.html",
                icon: "plane"
            },
            {
                title: "沖繩 冬之南國（簡約版）",
                description: "沖繩四日旅行企劃 — 那霸、美國村、南部絕景兜風。",
                path: "okinawa.html",
                icon: "palmtree"
            },
            {
                title: "沖繩 冬之南國（完整版）",
                description: "含照片上傳與記帳分帳功能的沖繩旅遊夥伴頁面。",
                path: "okinawa-1.html",
                icon: "camera"
            },
            {
                title: "建議售價計算器",
                description: "依平台手續費反推建議定價，無條件進位至 0 或 5 尾數。",
                path: "tesuuryo.html",
                icon: "calculator"
            }
        ];

        const projectsGrid = document.getElementById('projectsGrid');
        const searchInput = document.getElementById('searchInput');
        const emptyState = document.getElementById('emptyState');

        function renderProjects(filterText = '') {
            const filtered = projects.filter(p =>
                p.title.includes(filterText) ||
                p.description.includes(filterText)
            );

            projectsGrid.innerHTML = filtered.map(p => `
                <a href="${p.path}" class="project-card group block bg-white border border-stone-200/80 rounded-xl p-5 hover:border-stone-400 hover:shadow-sm relative">
                    <div class="w-10 h-10 rounded-lg bg-stone-50 flex items-center justify-center mb-4 text-stone-400 group-hover:text-stone-600 transition-colors">
                        <i data-lucide="${p.icon}" class="w-5 h-5 stroke-[1.5px]"></i>
                    </div>
                    <h3 class="text-base font-medium text-stone-800 mb-1.5">${p.title}</h3>
                    <p class="text-sm text-stone-400 leading-relaxed mb-4 line-clamp-2">${p.description}</p>
                    
                    <div class="flex items-center text-[11px] font-semibold text-stone-500 uppercase tracking-tighter opacity-0 group-hover:opacity-100 transition-opacity">
                        View Details <i data-lucide="arrow-up-right" class="ml-1 w-3 h-3"></i>
                    </div>
                </a>
            `).join('');

            lucide.createIcons();

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        searchInput.addEventListener('input', (e) => {
            renderProjects(e.target.value);
        });

        window.onload = () => {
            renderProjects();
        };
    </script>
</body>

</html>
