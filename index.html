<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專案儲存庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- Firebase & Tools -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="note/config.js"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .project-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-card:active {
            transform: scale(0.97);
        }

        .glass-effect {
            background: rgba(250, 250, 249, 0.85);
            /* Stone 50 with alpha */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e7e5e4;
            /* Stone 200 */
            border-radius: 10px;
        }

        .admin-toggle {
            transition: all 0.2s ease;
        }

        .project-card.project-hidden {
            opacity: 0.5;
            border-style: dashed;
            background: #fcfcfb;
        }

        .drag-handle {
            cursor: grab;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        /* 浮動儲存按鈕 */
        #saveChangesBtn {
            transform: translateX(-50%) translateY(100px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #saveChangesBtn.show {
            transform: translateX(-50%) translateY(0);
        }

        .sortable-ghost {
            opacity: 0.3;
            background: #f5f5f4 !important;
        }
    </style>
</head>

<body class="bg-[#F8F8F7] text-stone-800 min-h-screen pb-20">

    <!-- 頁首區塊 -->
    <header class="sticky top-0 z-50 glass-effect border-b border-stone-200/60 px-6 py-6 mb-10">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
                <h1 class="text-xl font-semibold tracking-tight text-stone-900">專案索引</h1>
                <p class="text-xs text-stone-400 mt-1 font-medium tracking-widest uppercase">Workspace Repository</p>
            </div>

            <!-- 搜尋框 與 登入 -->
            <div class="flex items-center gap-4">
                <div class="relative group">
                    <i data-lucide="search"
                        class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-400 group-focus-within:text-stone-600 transition-colors"></i>
                    <input type="text" id="searchInput" placeholder="搜尋名稱..."
                        class="w-full md:w-60 pl-10 pr-4 py-2 bg-stone-100/50 border-stone-200 border focus:bg-white focus:border-stone-400 rounded-xl transition-all outline-none text-sm placeholder:text-stone-400">
                </div>

                <!-- 低調登入按鈕 -->
                <button id="adminBtn" onclick="toggleAuth()"
                    class="w-9 h-9 flex items-center justify-center rounded-xl border border-stone-200/60 text-stone-300 hover:text-stone-500 hover:border-stone-300 transition-all hover:bg-white/50 tap-feedback"
                    title="管理登入">
                    <i data-lucide="fingerprint" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6">
        <!-- 專案網格 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="projectsGrid">
            <!-- 由 JavaScript 生成 -->
        </div>

        <!-- 空狀態 -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-32 text-stone-400">
            <i data-lucide="inbox" class="w-10 h-10 mb-4 stroke-[1.5px] opacity-30"></i>
            <p class="text-sm">無相符專案</p>
        </div>

        <!-- 批次儲存按鈕 (浮動) -->
        <div id="saveChangesBtn"
            class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[60] flex items-center gap-4 bg-stone-900 text-white px-6 py-4 rounded-2xl shadow-2xl pointer-events-none opacity-0 transition-all">
            <div class="flex flex-col">
                <span class="text-sm font-bold">內容已變更</span>
                <span class="text-[10px] text-stone-400 uppercase tracking-widest font-medium">Pending Update</span>
            </div>
            <button onclick="saveBatchChanges()"
                class="bg-white text-stone-900 px-5 py-2 rounded-xl text-sm font-bold tap-feedback pointer-events-auto">
                儲存變更
            </button>
        </div>
    </main>

    <script>
        // 專案資料
        const projects = [
            {
                title: "NightWhisper 夜語",
                description: "智慧睡眠監測 PWA — 偵測打呼與夢話，波形分析一目了然。",
                path: "nightwhisper/index.html",
                icon: "moon"
            },
            {
                title: "note 筆記應用",
                description: "極簡風格的雲端筆記工具，支援標籤、排序與變更比對。",
                path: "note/index.html",
                icon: "pencil"
            },
            {
                title: "個人音檔播放器",
                description: "基於 Vite + React 的音檔播放器前端專案。",
                path: "preview/index.html",
                icon: "headphones"
            },
            {
                title: "V-Player Web App",
                description: "影音播放器 Web App，深色介面設計。",
                path: "v-player-preview/index.html",
                icon: "play-circle"
            },
            {
                title: "Travel Planner",
                description: "旅遊行程規劃工具，Vue + Vite 前後端架構。",
                path: "travel-planner/index.html",
                icon: "map-pin"
            },
            {
                title: "關西・名古屋 7日漫遊",
                description: "2025 大阪、奈良、京都、名古屋七日自由行行程表。",
                path: "nagoya.html",
                icon: "plane"
            },
            {
                title: "沖繩 冬之南國（簡約版）",
                description: "沖繩四日旅行企劃 — 那霸、美國村、南部絕景兜風。",
                path: "okinawa.html",
                icon: "palmtree"
            },
            {
                title: "沖繩 冬之南國（完整版）",
                description: "含照片上傳與記帳分帳功能的沖繩旅遊夥伴頁面。",
                path: "okinawa-1.html",
                icon: "camera"
            },
            {
                title: "建議售價計算器",
                description: "依平台手續費反推建議定價，無條件進位至 0 或 5 尾數。",
                path: "tesuuryo.html",
                icon: "calculator"
            },
            {
                title: "FlatModern PDF Studio",
                description: "高品質 PDF 處理套件：包含扁平化與體積壓縮，支援雲端 Ghostscript 引擎。",
                path: "pdf-tool/index.html",
                icon: "file-text"
            }
        ];

        const projectsGrid = document.getElementById('projectsGrid');
        const searchInput = document.getElementById('searchInput');
        const emptyState = document.getElementById('emptyState');

        // --- Firebase Init ---
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.app().firestore('jing-lab');
        const provider = new firebase.auth.GoogleAuthProvider();
        const ADMIN_EMAIL = "wj209ing@gmail.com";

        let state = {
            isAdmin: false,
            hiddenProjects: [], // 儲存在 Firestore 中的隱藏專案 path 清單
            projectOrder: [],   // 儲存在 Firestore 中的專案路徑順序
            localOrder: [],     // 本地目前的排序
            localHidden: [],    // 本地目前的隱藏狀態
            isDirty: false
        };

        let sortableInstance = null;

        // --- Auth 邏輯 ---
        async function toggleAuth() {
            if (state.isAdmin) {
                if (confirm("要登出管理模式嗎？")) {
                    await auth.signOut();
                    location.reload();
                }
            } else {
                try {
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    console.error(e);
                }
            }
        }

        auth.onAuthStateChanged(async (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                state.isAdmin = true;
                document.getElementById('adminBtn').classList.add('text-stone-600', 'border-stone-400', 'bg-white');
                document.getElementById('adminBtn').innerHTML = `<i data-lucide="unlock" class="w-4 h-4"></i>`;
            } else {
                state.isAdmin = false;
                document.getElementById('adminBtn').innerHTML = `<i data-lucide="fingerprint" class="w-4 h-4"></i>`;
            }
            lucide.createIcons();
            await fetchConfig();
            renderProjects(searchInput.value);
        });

        // --- Firestore 設定讀取 ---
        async function fetchConfig() {
            try {
                const doc = await db.collection('configs').doc('project_index').get();
                if (doc.exists) {
                    const data = doc.data();
                    state.hiddenProjects = data.hiddenProjects || [];
                    state.projectOrder = data.projectOrder || [];

                    // 同步本地狀態
                    state.localHidden = [...state.hiddenProjects];

                    // 如果雲端沒有順序，則使用目前的預設順序
                    if (state.projectOrder.length === 0) {
                        state.localOrder = projects.map(p => p.path);
                    } else {
                        state.localOrder = [...state.projectOrder];
                        // 檢查是否有新專案不在 projectOrder 中
                        projects.forEach(p => {
                            if (!state.localOrder.includes(p.path)) state.localOrder.push(p.path);
                        });
                    }
                } else {
                    state.localOrder = projects.map(p => p.path);
                    state.localHidden = [];
                }
            } catch (e) {
                console.warn("Firestore fetch error (guest mode likely):", e);
                state.localOrder = projects.map(p => p.path);
            }
        }

        function checkDirty() {
            const isOrderChanged = JSON.stringify(state.localOrder) !== JSON.stringify(state.projectOrder);
            const isHiddenChanged = JSON.stringify(state.localHidden.sort()) !== JSON.stringify(state.hiddenProjects.sort());

            state.isDirty = state.isAdmin && (isOrderChanged || isHiddenChanged);

            const btn = document.getElementById('saveChangesBtn');
            if (state.isDirty) {
                btn.classList.add('show', 'opacity-100', 'pointer-events-auto');
                btn.classList.remove('pointer-events-none');
            } else {
                btn.classList.remove('show', 'opacity-100', 'pointer-events-auto');
                btn.classList.add('pointer-events-none');
            }
        }

        async function toggleProjectVisibility(path, event) {
            event.preventDefault();
            event.stopPropagation();

            if (!state.isAdmin) return;

            if (state.localHidden.includes(path)) {
                state.localHidden = state.localHidden.filter(p => p !== path);
            } else {
                state.localHidden.push(path);
            }

            renderProjects(searchInput.value);
            checkDirty();
        }

        async function saveBatchChanges() {
            if (!state.isAdmin) return;

            const btn = document.querySelector('#saveChangesBtn button');
            const originalText = btn.innerText;
            btn.innerText = "儲存中...";
            btn.disabled = true;

            try {
                await db.collection('configs').doc('project_index').set({
                    hiddenProjects: state.localHidden,
                    projectOrder: state.localOrder
                });

                // 更新基準點
                state.hiddenProjects = [...state.localHidden];
                state.projectOrder = [...state.localOrder];
                state.isDirty = false;

                checkDirty();
                // 這裡不使用提示，改回原本的低調風格
                lucide.createIcons();
            } catch (e) {
                console.error(e);
                alert("儲存失敗，請檢查權限。");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // --- 初始化 Sortable ---
        function initSortable() {
            if (!state.isAdmin) {
                if (sortableInstance) {
                    sortableInstance.destroy();
                    sortableInstance = null;
                }
                return;
            }

            // 如果已經有搜尋過濾，不允許拖拉
            if (searchInput.value) {
                if (sortableInstance) {
                    sortableInstance.option("disabled", true);
                }
                return;
            }

            if (sortableInstance) {
                sortableInstance.option("disabled", false);
                return;
            }

            sortableInstance = Sortable.create(projectsGrid, {
                animation: 250,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                forceFallback: true, // 行動裝置優化
                onEnd: function () {
                    const newOrder = Array.from(projectsGrid.querySelectorAll('[data-path]')).map(el => el.dataset.path);
                    state.localOrder = newOrder;
                    checkDirty();
                }
            });
        }

        function renderProjects(filterText = '') {
            // 首先按照 localOrder 重新排序專案陣列
            const orderedProjects = state.localOrder.map(path => projects.find(p => p.path === path)).filter(p => p);

            // 加入那些可能在 code 中有但 localOrder 沒紀錄到的專案
            projects.forEach(p => {
                if (!state.localOrder.includes(p.path)) orderedProjects.push(p);
            });

            let filtered = orderedProjects.filter(p =>
                p.title.includes(filterText) ||
                p.description.includes(filterText)
            );

            // 隱私過濾：如果不是管理員，則排除隱藏專案
            if (!state.isAdmin) {
                filtered = filtered.filter(p => !state.localHidden.includes(p.path));
            }

            projectsGrid.innerHTML = filtered.map(p => {
                const isHidden = state.localHidden.includes(p.path);
                return `
                <div class="relative group h-full" data-path="${p.path}">
                    <a href="${p.path}" class="project-card block bg-white border border-stone-200/80 rounded-xl p-5 hover:border-stone-400 hover:shadow-sm h-full ${isHidden ? 'project-hidden' : ''}">
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-10 h-10 rounded-lg ${isHidden ? 'bg-stone-100' : 'bg-stone-50'} flex items-center justify-center text-stone-400 group-hover:text-stone-600 transition-colors">
                                <i data-lucide="${p.icon}" class="w-5 h-5 stroke-[1.5px]"></i>
                            </div>
                            
                            ${state.isAdmin ? `
                                <div class="flex items-center gap-1">
                                    <button onclick="toggleProjectVisibility('${p.path}', event)" 
                                        class="w-8 h-8 flex items-center justify-center rounded-lg bg-stone-50 border border-stone-200 text-stone-400 hover:text-stone-600 hover:bg-white transition-all shadow-sm"
                                        title="${isHidden ? '顯示專案' : '隱藏專案'}">
                                        <i data-lucide="${isHidden ? 'eye' : 'eye-off'}" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <div class="drag-handle w-8 h-8 flex items-center justify-center rounded-lg bg-stone-50 border border-stone-200 text-stone-300 hover:text-stone-500 transition-all">
                                        <i data-lucide="grip-vertical" class="w-3.5 h-3.5"></i>
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <h3 class="text-base font-medium text-stone-800 mb-1.5 flex items-center gap-2">
                            ${p.title}
                            ${isHidden ? '<span class="text-[10px] bg-stone-100 text-stone-400 px-1.5 py-0.5 rounded uppercase tracking-tighter font-bold">Hidden</span>' : ''}
                        </h3>
                        <p class="text-sm text-stone-400 leading-relaxed mb-4 line-clamp-2">${p.description}</p>
                        
                        <div class="flex items-center text-[11px] font-semibold text-stone-500 uppercase tracking-tighter opacity-0 group-hover:opacity-100 transition-opacity">
                            View Project <i data-lucide="arrow-up-right" class="ml-1 w-3 h-3"></i>
                        </div>
                    </a>
                </div>
            `;
            }).join('');

            lucide.createIcons();
            initSortable();

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        searchInput.addEventListener('input', (e) => {
            renderProjects(e.target.value);
        });

        window.onload = () => {
            // Data will reload when onAuthStateChanged triggers
        };
    </script>
</body>

</html>
